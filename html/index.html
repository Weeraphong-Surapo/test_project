<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Docker HTML Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .clock {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f4f4f9;
            border-radius: 8px;
        }
        .clock .label {
            font-size: 0.9rem;
            color: #888;
            margin: 0 0 0.25rem;
        }
        .clock .time {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 สวัสดียินดีต้อนรับ!</h1>
        <p>เว็บ HTML ของคุณกำลังทำงานอยู่บน Docker Compose ผ่าน Nginx</p>
        <div class="clock">
            <p class="label">ตอนนี้เวลา</p>
            <div class="time" id="clock">--:--:--</div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleTimeString('th-TH', { hour12: false });
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
